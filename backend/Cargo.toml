[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
form_urlencoded = "1"
hex = "0.4"
hmac = "0.12"
langchain-rust = { version = "4.6", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "json", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[dev-dependencies]
testcontainers = "0.25"
tower = { version = "0.5", features = ["util"] }
